    <script>
      (() => {
        const isDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>

  <body>

    <noscript>
      <main style="max-width:48rem;margin:3rem auto;padding:1rem;font:1rem/1.6 system-ui">
        <h1>Year at a glance calendar with sticky notes</h1>
        <p>Calendar365 is a visual year planner for seeing your whole year on one screen. Zoom through dates and add colorful sticky notes to plan projects, trips and deadlines.</p>
        <h2>Try the calendar, then save your plans</h2>
        <p>Enable JavaScript to open the interactive demo. You can explore the calendar without an account. Sign in to save your own calendars and notes; account limits and optional unlocks are shown in the app.</p>
